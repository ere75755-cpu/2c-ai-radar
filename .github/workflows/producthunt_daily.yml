name: Product Hunt Daily Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: product-hunt-sync
  cancel-in-progress: false

jobs:
  producthunt-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Product Hunt
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: python scripts/fetch_producthunt.py

      - name: Commit Product Hunt raw data
        run: |
          git config user.name "product-radar-bot"
          git config user.email "product-radar-bot@users.noreply.github.com"

          git add data/products_raw.json
          git add data/product_metrics.json
          git add data/scan_status.json

          git diff --cached --quiet || git commit -m "Auto-update Product Hunt raw data"
          git push
