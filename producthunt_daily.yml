name: Product Hunt Daily Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: product-hunt-sync
  cancel-in-progress: false

jobs:
  producthunt-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Product Hunt
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: python scripts/fetch_producthunt.py

      - name: Classify and research AI products
        env:
          # 公司 LiteLLM 网关配置
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}

          # 实际调用模型
          LITELLM_MODEL: gpt-5.6-luna

          # 单次 GitHub Actions 最多新增 50 次模型调用
          # 防止代码异常导致大量消耗
          MAX_LLM_CALLS: "50"

          # 仅用于日志成本估算
          INPUT_PRICE_RMB_PER_M: "1.35"
          OUTPUT_PRICE_RMB_PER_M: "8.11"

        run: python scripts/classify_products.py

      - name: Build dashboard data
        run: python scripts/build_dashboard_data.py

      - name: Commit updated data
        run: |
          git config user.name "product-radar-bot"
          git config user.email "product-radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-update Product Hunt data"
          git push
